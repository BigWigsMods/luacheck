name: luacheck
description: Runs luacheck in Docker. Optionally runs a custom Lua script (from URL or path) after or instead of luacheck.
branding:
  icon: check-square
  color: yellow

inputs:
  files:
    description: >
      What to pass to luacheck (default "." = whole repo). Narrow only if you want to limit scope.
    required: false
    default: '.'
  path:
    description: >
      Working directory for luacheck. Relative to workspace root. Use "." for repo root.
    required: false
    default: '.'
  args:
    description: >
      Additional luacheck arguments. See https://luacheck.readthedocs.io/en/stable/cli.html
    required: false
    default: ''
  config:
    description: >
      URL to a custom .luacheckrc config file.
    required: false
    default: ''
  image_tag:
    description: >
      Docker image tag to run. By default, released action refs like v1 use the matching
      image tag; other refs use latest.
    required: false
    default: ''
  annotate:
    description: >
      Emit GitHub annotations for issues. "none", "warning", or "error".
      Requires warnings not be suppressed (avoid -qq or -qqq with args).
    required: false
    default: none
  custom_script:
    description: >
      URL or path (relative to path, or absolute) to a Lua script to run after luacheck.
    required: false
    default: ''
  custom_args:
    description: >
      Arguments passed to the custom script.
    required: false
    default: '.'
  run_luacheck:
    description: >
      When false, skip luacheck (script-only mode).
    required: false
    default: true
  fail_fast:
    description: >
      When true, exit on first failure (luacheck or script). When false, run both and exit with failure if any failed.
    required: false
    default: false
  job_summary:
    description: >
      When true, append a Markdown summary to the workflow run Summary tab (GITHUB_STEP_SUMMARY).
      On failure, includes captured luacheck or custom-script output in the summary.
    required: false
    default: false

runs:
  using: composite
  steps:
    - name: Run luacheck
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
        INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
      run: |
        # docker pull -> docker run
        IMAGE_TAG="$INPUT_IMAGE_TAG"
        if [ -z "$IMAGE_TAG" ]; then
          case "$ACTION_REF" in
            v[0-9]*)
              IMAGE_TAG="$ACTION_REF"
              ;;
            *)
              IMAGE_TAG="latest"
              ;;
          esac
        fi

        IMAGE="ghcr.io/bigwigsmods/luacheck:${IMAGE_TAG}"
        SAFE_IMAGE_TAG=$(printf '%s' "$IMAGE_TAG" | tr -c 'A-Za-z0-9_.-' '_')
        MARKER_DIR="${RUNNER_TEMP:-/tmp}/luacheck-action"
        MARKER_FILE="${MARKER_DIR}/luacheck-docker-init-${SAFE_IMAGE_TAG}"

        mkdir -p "$MARKER_DIR"
        if [ ! -f "$MARKER_FILE" ]; then
          for attempt in 1 2 3 4 5; do
            if docker pull -q "$IMAGE" >/dev/null; then
              touch "$MARKER_FILE"
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Pull attempt $attempt/5 failed, retrying in $((attempt * 10))s..."
              sleep $((attempt * 10))
            fi
          done
          if [ ! -f "$MARKER_FILE" ]; then
            echo "::error::Failed to pull $IMAGE after 5 attempts"
            exit 1
          fi
        fi

        EXTRA=()
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          EXTRA+=(-v "${GITHUB_STEP_SUMMARY}:${GITHUB_STEP_SUMMARY}")
          EXTRA+=(-e GITHUB_STEP_SUMMARY)
        fi

        set +e
        output=$(docker run --rm \
          "${EXTRA[@]}" \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          -e INPUT_FILES="${{ inputs.files }}" \
          -e INPUT_PATH="${{ inputs.path }}" \
          -e INPUT_ARGS="${{ inputs.args }}" \
          -e INPUT_CONFIG="${{ inputs.config }}" \
          -e INPUT_ANNOTATE="${{ inputs.annotate }}" \
          -e INPUT_CUSTOM_SCRIPT="${{ inputs.custom_script }}" \
          -e INPUT_CUSTOM_ARGS="${{ inputs.custom_args }}" \
          -e INPUT_RUN_LUACHECK="${{ inputs.run_luacheck }}" \
          -e INPUT_FAIL_FAST="${{ inputs.fail_fast }}" \
          -e INPUT_JOB_SUMMARY="${{ inputs.job_summary }}" \
          -e GITHUB_WORKSPACE=/workspace \
          "$IMAGE" 2>&1)
        exitcode=$?
        echo "$output"
        exit "$exitcode"
